[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dovideo-python"
version = "0.1.0"
description = "Provider-neutral long-video analysis with timestamped evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "Pillow>=10,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "redis>=5.0,<8",
    "minio>=7.2,<8",
    "celery>=5.4,<6",
]

[project.scripts]
dovideo = "dovideo.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
