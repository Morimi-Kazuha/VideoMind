name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Offline tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts alembic
      - name: Deployment environment and production composition
        run: python scripts/validate_deployment.py --env-file .env.example
      - name: Docker Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.r2.yml config --quiet
      - name: Alembic upgrade and model drift
        env:
          DOVIDEO_DATABASE_URL: sqlite:///migration-ci.db
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
