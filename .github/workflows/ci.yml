name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints-py312.txt
      - name: Install
        run: python -m pip install -c constraints-py312.txt -e ".[test]"
      - name: Offline tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts alembic
      - name: Deployment environment and production composition
        run: python scripts/validate_deployment.py --env-file .env.example
      - name: Docker Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.r2.yml config --quiet
      - name: Alembic upgrade and model drift
        env:
          DOVIDEO_DATABASE_URL: sqlite:///migration-ci.db
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Mounted component tests
        run: npm run test:components
      - name: Build
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    env:
      DOVIDEO_PROFILE: production
      DOVIDEO_GOVERNANCE_BROKER: amqp://governance:governance-test@127.0.0.1:25672/%2F
      DOVIDEO_GOVERNANCE_REDIS: redis://127.0.0.1:26379/0
      DOVIDEO_ENGINEERING_LIVE: "1"
      DOVIDEO_MEMORY_REDIS_LIVE: "1"
      DOVIDEO_TASK_LEASE_LIVE: "1"
      DOVIDEO_UPLOAD_LIVE: "1"
      DOVIDEO_ENGINEERING_ADMIN_URL: mysql+pymysql://root:governance-test@127.0.0.1:23306/mysql
      DOVIDEO_DATABASE_URL: mysql+pymysql://root:governance-test@127.0.0.1:23306/videomind_governance
      DOVIDEO_REDIS_URL: redis://127.0.0.1:26379/0
      DOVIDEO_MINIO_ENDPOINT: 127.0.0.1:29000
      DOVIDEO_MINIO_ACCESS_KEY: governance
      DOVIDEO_MINIO_SECRET_KEY: governance-test
      DOVIDEO_MINIO_BUCKET: governance-media
      DOVIDEO_MINIO_SECURE: "false"
      DOVIDEO_QDRANT_URL: http://127.0.0.1:26333
      DOVIDEO_QDRANT_COLLECTION: governance-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints-py312.txt -e ".[test]"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: docker compose -f docker-compose.governance.yml up -d --wait
      - name: Initialize isolated upload database and bucket
        run: |
          docker compose -f docker-compose.governance.yml exec -T mysql mysql -uroot -pgovernance-test -e 'CREATE DATABASE videomind_governance'
          python -m alembic upgrade head
          python -c 'import asyncio; from dovideo.infrastructure.r2_config import create_r2_infrastructure; infra = create_r2_infrastructure(); asyncio.run(infra.initialize()); infra.close()'
      - name: Real storage, broker, leases, CAS and media contracts
        run: >-
          python -m pytest -q tests/infrastructure/test_governance_broker_live.py
          tests/infrastructure/test_response_files.py tests/infrastructure/test_audio_export.py
          tests/infrastructure/test_engineering_live.py
          tests/infrastructure/test_m1_conversation_redis_live.py
          tests/infrastructure/test_task_lease_redis_live.py
          tests/infrastructure/test_upload_redis_minio_live.py
          tests/infrastructure/test_governance_media_live.py
      - name: Remove isolated test services
        if: always()
        run: docker compose -f docker-compose.governance.yml down -v
